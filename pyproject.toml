[project]
name = "zoya"
version = "0.0.1"
description = "Voice-first AI agent that operates a Mac for blind and low-vision people."
readme = "README.md"
requires-python = ">=3.12"
# Versions are pinned in Phase 0 after verifying against official docs (see AGENTS.md).
dependencies = [
  "strands-agents[openai,otel]",
  "openai",
  "elevenlabs",
  "mlx-whisper",
  "strands-agents-tools",
  "boto3",  # AWS services (docs/STACK.md §8)
  "python-dotenv",
  "faster-whisper",
  "sounddevice",
  "soundfile",
  "numpy",
  "pyautogui",
  "pyobjc-framework-Quartz",
  "pyobjc-framework-ApplicationServices",
  "pyobjc-framework-ScreenCaptureKit",
  "playwright",
  "python-pptx",
  "python-docx",
  "openpyxl",
  "reportlab",
  "supermemory",
  "rumps",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "isort"]
# Only if AWS Bedrock is unblocked (docs/STACK.md §5)
bedrock = ["boto3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zoya*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
