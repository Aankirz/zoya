<!doctype html>
<html>
<head><meta charset="utf-8"><title>Test News Site</title></head>
<body style="font-family: sans-serif; padding: 40px;">
  <h1>Today's Headlines</h1>
  <p>Article content goes here.</p>
  <div id="popup" style="position:fixed; top:100px; left:100px; right:100px; background:white; border:2px solid #333; padding:30px;">
    <h2>Subscribe for 20% off!</h2>
    <button id="subscribe">Subscribe</button>
    <button id="close">Close</button>
  </div>
  <div id="success" hidden>done</div>
  <script>
    document.getElementById('close').onclick = () => {
      document.getElementById('popup').remove();
      document.getElementById('success').hidden = false;
    };
    document.getElementById('subscribe').onclick = () => {};
  </script>
</body>
</html>
