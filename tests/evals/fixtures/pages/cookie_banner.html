<!doctype html>
<html>
<head><meta charset="utf-8"><title>Test Site</title></head>
<body style="font-family: sans-serif; padding: 40px;">
  <h1>Welcome to Test Site</h1>
  <p>Some article content goes here.</p>
  <div id="banner" style="position:fixed; bottom:0; left:0; right:0; background:#222; color:white; padding:20px;">
    We use cookies. <button id="accept">Accept</button> <button id="reject">Reject</button>
  </div>
  <div id="success" hidden>done</div>
  <script>
    document.getElementById('accept').onclick = () => {
      document.getElementById('banner').remove();
      document.getElementById('success').hidden = false;
    };
    document.getElementById('reject').onclick = () => {
      document.getElementById('banner').remove();
    };
  </script>
</body>
</html>
